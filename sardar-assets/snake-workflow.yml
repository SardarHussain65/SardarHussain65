name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Purple-Themed Snake
        uses: Platane/snk@v3
        with:
          github_user_name: SardarHussain65
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f0abfc&color_dots=#161b22,#581c87,#9333ea,#d946ef,#f5d0fe
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f0abfc&color_dots=#161b22,#581c87,#9333ea,#d946ef,#f5d0fe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
